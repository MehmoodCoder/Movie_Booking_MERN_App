<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <!-- Deep Black Background -->
  <rect width="1000" height="560" fill="#0b0b0b"/>
  
  <g transform="translate(180, 40)">
    <!-- Outer Glow / Background Shadow Outline Effect -->
    <!-- Projector Body & Reels Vector Paths -->
    
    <!-- Small Back Reel -->
    <g transform="translate(145, 140)">
      <circle cx="50" cy="50" r="46" fill="#690c17" stroke="#250407" stroke-width="4"/>
      <circle cx="50" cy="50" r="14" fill="#0b0b0b"/>
      <!-- Inner details -->
      <circle cx="50" cy="20" r="6" fill="#a81525"/>
      <circle cx="50" cy="80" r="6" fill="#a81525"/>
      <circle cx="20" cy="50" r="6" fill="#a81525"/>
      <circle cx="80" cy="50" r="6" fill="#a81525"/>
    </g>

    <!-- Main Top Big Reel -->
    <g transform="translate(380, 95)">
      <circle cx="65" cy="65" r="62" fill="#87101d" stroke="#250407" stroke-width="6"/>
      <circle cx="65" cy="65" r="20" fill="#0b0b0b"/>
      <!-- Play Icon inside Reel Center -->
      <polygon points="60,53 78,65 60,77" fill="#c41c2e"/>
      <!-- Reel Holes -->
      <circle cx="65" cy="22" r="9" fill="#250407"/>
      <circle cx="65" cy="108" r="9" fill="#250407"/>
      <circle cx="22" cy="65" r="9" fill="#250407"/>
      <circle cx="108" cy="65" r="9" fill="#250407"/>
      <circle cx="35" cy="35" r="7" fill="#250407"/>
      <circle cx="95" cy="35" r="7" fill="#250407"/>
      <circle cx="35" cy="95" r="7" fill="#250407"/>
      <circle cx="95" cy="95" r="7" fill="#250407"/>
    </g>

    <!-- Projector Main Body -->
    <rect x="180" y="225" width="290" height="125" rx="16" fill="#87101d" stroke="#250407" stroke-width="8"/>
    
    <!-- Front Lens / Nozzle -->
    <path d="M 470 245 L 530 220 L 530 325 L 470 300 Z" fill="#3a060b" stroke="#250407" stroke-width="6"/>
    
    <!-- Back Lens / Dial Connector -->
    <rect x="150" y="250" width="30" height="60" rx="8" fill="#690c17" stroke="#250407" stroke-width="6"/>
    
    <!-- Side Details on Body (Control Panel Window) -->
    <rect x="210" y="250" width="105" height="55" rx="8" fill="#3a060b" stroke="#1a0204" stroke-width="5"/>
    <rect x="325" y="265" width="45" height="12" rx="4" fill="#3a060b" stroke="#1a0204" stroke-width="4"/>
    <circle cx="230" cy="278" r="9" fill="#87101d"/>
    <line x1="250" y1="270" x2="295" y2="270" stroke="#87101d" stroke-width="6" stroke-linecap="round"/>
    <line x1="250" y1="290" x2="280" y2="290" stroke="#87101d" stroke-width="6" stroke-linecap="round"/>
    <circle cx="230" cy="315" r="6" fill="#3a060b"/>
    <rect x="250" y="312" width="25" height="6" rx="3" fill="#3a060b"/>
    <rect x="285" y="312" width="15" height="6" rx="3" fill="#3a060b"/>

    <!-- Stand / Bottom Base -->
    <path d="M 230 350 L 410 350 L 390 365 L 250 365 Z" fill="#3a060b" stroke="#250407" stroke-width="6"/>

    <!-- Popcorn Tub beside Projector -->
    <g transform="translate(435, 255)">
      <!-- Tub Body -->
      <path d="M 12 35 L 22 95 L 68 95 L 78 35 Z" fill="#87101d" stroke="#250407" stroke-width="6"/>
      <!-- White Stripes on Tub -->
      <path d="M 32 37 L 36 93" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
      <path d="M 58 37 L 54 93" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
      <!-- Popcorn Puffs Top -->
      <circle cx="25" cy="30" r="14" fill="#ffffff" stroke="#250407" stroke-width="4"/>
      <circle cx="45" cy="22" r="16" fill="#ffffff" stroke="#250407" stroke-width="4"/>
      <circle cx="65" cy="30" r="14" fill="#ffffff" stroke="#250407" stroke-width="4"/>
      <circle cx="45" cy="38" r="12" fill="#ffffff"/>
    </g>
  </g>

  <!-- Typography: MoviefyHub -->
  <text x="500" y="475" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#c41c2e" text-anchor="middle" letter-spacing="0.5">
    Moviefy<tspan fill="#ffffff">Hub</tspan>
  </text>
</svg>
